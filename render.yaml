# Render blueprint — deploy Errand as a single long-lived web service.
# A single instance means the in-memory mandate store persists across requests
# for the whole demo (no cold-instance 404s). Add the secrets in the Render
# dashboard; the app also runs fully in mock mode with none of them set.
#
# ponytail: single instance is the demo-grade fix. For multi-instance / true
# durability, back lib/store.ts + lib/ledger.ts with Postgres and drop numInstances.
services:
  - type: web
    name: errand
    runtime: node
    plan: free
    numInstances: 1
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      - key: CHANNEL3_API_KEY
        sync: false
      - key: AI_GATEWAY_API_KEY
        sync: false
      - key: AI_MODEL
        value: anthropic/claude-sonnet-4.5
