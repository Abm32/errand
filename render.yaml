# Render blueprint — deploy Errand as a single long-lived web service.
# The store/ledger are file-backed (lib/store.ts, lib/ledger.ts), so state
# survives restarts; a single instance keeps that one file authoritative and
# avoids cross-instance splits. Add the secrets in the Render dashboard; the app
# also runs fully in mock mode with none of them set.
#
# ponytail: single instance + file store is the demo-grade fix. For
# multi-instance / high concurrency, back the store with Postgres and drop numInstances.
services:
  - type: web
    name: errand
    runtime: node
    plan: free
    numInstances: 1
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CURRENCY
        value: USD
      - key: CHANNEL3_API_KEY
        sync: false
      - key: AI_GATEWAY_API_KEY
        sync: false
      - key: AI_MODEL
        value: anthropic/claude-sonnet-4.5
