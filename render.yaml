# Render blueprint — deploy Gofer as a single long-lived web service.
# The store/ledger are file-backed (lib/store.ts, lib/ledger.ts), so state
# survives restarts; a single instance keeps that one file authoritative and
# avoids cross-instance splits. Add the secrets in the Render dashboard; the app
# also runs fully in mock mode with none of them set.
#
# ponytail: single instance + file store is the demo-grade fix. For
# multi-instance / high concurrency, back the store with Postgres and drop numInstances.
services:
  - type: web
    name: errand
    runtime: node
    # Standard (1 CPU / 2 GB) — the Bryntum Gantt bundle OOMs the 512 MB free
    # builder during `next build`; 2 GB builds it fine. Covered by Render credits.
    plan: standard
    numInstances: 1
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    # Persistent disk so the server-authoritative spend + ledger survive restarts
    # and redeploys — the "can't overspend" guarantee must hold across reboots,
    # not just within one process lifetime.
    disk:
      name: gofer-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: STORE_FILE
        value: /var/data/store.json
      - key: LEDGER_FILE
        value: /var/data/ledger.json
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CURRENCY
        value: USD
      - key: CHANNEL3_API_KEY
        sync: false
      - key: AI_GATEWAY_API_KEY
        sync: false
      - key: AI_MODEL
        value: anthropic/claude-sonnet-4.5
